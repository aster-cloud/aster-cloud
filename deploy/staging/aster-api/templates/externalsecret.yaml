{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aster-api-secrets
  namespace: aster-cloud-staging
  labels:
    app.kubernetes.io/name: aster-api
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: aster-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: QUARKUS_DATASOURCE_JDBC_URL
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: QUARKUS_DATASOURCE_JDBC_URL
    - secretKey: QUARKUS_DATASOURCE_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: QUARKUS_DATASOURCE_USERNAME
    - secretKey: QUARKUS_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: QUARKUS_DATASOURCE_PASSWORD
    - secretKey: ASTER_LLM_API_KEY
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: ASTER_LLM_API_KEY
    - secretKey: ASTER_PLAN_GATE_HMAC_KEY
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: ASTER_PLAN_GATE_HMAC_KEY
{{- end }}
