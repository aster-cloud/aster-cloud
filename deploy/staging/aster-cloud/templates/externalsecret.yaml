{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aster-cloud-secrets
  namespace: aster-cloud-staging
  labels:
    app.kubernetes.io/name: aster-cloud
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: aster-cloud-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: DATABASE_URL
    - secretKey: AUTH_SECRET
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: AUTH_SECRET
    - secretKey: CRON_SECRET
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: CRON_SECRET
    - secretKey: ASTER_PLAN_GATE_HMAC_KEY
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: ASTER_PLAN_GATE_HMAC_KEY
    - secretKey: AI_KEY_ENCRYPTION_SECRET
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: AI_KEY_ENCRYPTION_SECRET
    - secretKey: LICENSE_KEY
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: LICENSE_KEY
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: STRIPE_SECRET_KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: STRIPE_WEBHOOK_SECRET
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: RESEND_API_KEY
{{- end }}
