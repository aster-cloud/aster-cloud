apiVersion: v1
kind: Service
metadata:
  name: aster-cloud
  namespace: aster-cloud-staging
  labels:
    app.kubernetes.io/name: aster-cloud
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: aster-cloud
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
