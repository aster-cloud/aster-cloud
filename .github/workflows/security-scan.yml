name: Security scan (nuclei + zap)

# P0-8: 周度扫描生产域名查漏洞
# 运行：每周日 02:00 UTC（避开生产忙时）+ 手动触发

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read


jobs:
  # projectdiscovery/nuclei-action@v3 (current v3.1.1) reworked its API:
  # the old `target` / `flags` / `output` inputs are gone — everything
  # goes through `args` now. We use --install-only=false (the default)
  # and pass the full nuclei CLI invocation via args so the action
  # behaves like a thin wrapper around the binary.
  #
  # `continue-on-error: true` on each scan step so a transient nuclei
  # exit code (e.g. target unreachable, partial template failure)
  # doesn't bypass the explicit critical/high gate at the end.
  nuclei:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Nuclei scan (aster-lang.cloud)
        continue-on-error: true
        uses: projectdiscovery/nuclei-action@v3
        with:
          args: >-
            -target https://aster-lang.cloud
            -severity critical,high,medium
            -jsonl-export nuclei-aster-cloud.jsonl
            -timeout 30
            -rate-limit 100

      - name: Nuclei scan (policy.aster-lang.dev)
        continue-on-error: true
        uses: projectdiscovery/nuclei-action@v3
        with:
          args: >-
            -target https://policy.aster-lang.dev
            -severity critical,high,medium
            -jsonl-export nuclei-aster-api.jsonl
            -timeout 30
            -rate-limit 100

      - name: Upload reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: nuclei-${{ github.run_id }}
          path: nuclei-*.jsonl
          if-no-files-found: warn

      # Gate runs against the captured JSONL output.
      #
      # ★2026-07-29 审计修复：原实现有两条独立的假阴性通路，且两条都指向「通过」。
      #
      #   1. 扫描步是 continue-on-error，扫描崩溃/超时/目标不可达时不产出文件；
      #      而 gate 用 `[ -f "$f" ] || continue` 把「文件不存在」当成「没有发现」
      #      —— 一次什么都没扫的运行会报告 PASS。安全 gate 无法失败比没有 gate
      #      更糟：它制造的是虚假信心。现在改为**先校验产出存在**，缺文件即失败。
      #
      #   2. `"severity":"high"` 这个 grep 不容忍空格。nuclei 若输出
      #      `"severity": "high"`（冒号后带空格）或把 severity 嵌在 info 下，
      #      计数恒为 0 —— 有真实 critical 发现也照样放行。改用 jq 按结构取值
      #      （runner 自带 jq），并对解析失败本身报错。
      - name: Fail on critical/high
        run: |
          set -euo pipefail

          expected="nuclei-aster-cloud.jsonl nuclei-aster-api.jsonl"
          missing=""
          for f in $expected; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::扫描产出缺失:$missing —— 扫描很可能未真正执行"
            echo "::error::缺产出一律判失败：不能把「没扫」当成「没问题」"
            exit 1
          fi

          fail=0
          for f in $expected; do
            # .info.severity 是 nuclei JSONL 的规范位置；解析失败要报错而非静默计 0
            # -c 让每条发现压成一行，再数行数；否则 jq 默认多行输出会把
            # 「1 条发现」数成它的字段行数（实测 1 条被数成 6）。
            if ! count=$(jq -c 'select((.info.severity // .severity) |
                          ascii_downcase | . == "critical" or . == "high")' "$f" | wc -l | tr -d ' '); then
              echo "::error::$f 解析失败——无法判定发现数，按失败处理"
              exit 1
            fi
            echo "$f: $count critical/high"
            if [ "$count" -gt 0 ]; then
              echo "::error::$f has $count critical/high findings"
              fail=1
            fi
          done
          exit $fail

  # ZAP baseline jobs share two non-default settings:
  #   fail_action: false           — warn-only; baseline noise (CSP wildcard,
  #                                   STS header, X-Powered-By, etc.) is
  #                                   reported in the artifact but never
  #                                   blocks the schedule.
  #   allow_issue_writing: false   — the action's default behavior is to
  #                                   POST one GitHub issue per WARN-NEW
  #                                   finding, which (a) needs `issues:
  #                                   write` permission we intentionally
  #                                   don't grant the workflow, and (b)
  #                                   floods the repo issue tracker every
  #                                   Sunday with the same baseline noise.
  #                                   Disabling issue writes is what fixes
  #                                   the "Resource not accessible by
  #                                   integration" failure on prior runs.
  #
  # Action pinned to @v0.15.0 (not v0.12.0): v0.12.0 calls
  # @actions/upload-artifact v3, which GitHub retired on 2025-01-30 —
  # every upload now fails with "Create Artifact Container failed".
  # v0.15.0 uses @actions/artifact v2.x (artifacts v4 service) and runs
  # on Node 24.
  #
  # artifact_name is namespaced per target so both jobs' HTML/JSON
  # reports survive on the workflow run rather than colliding on the
  # default "zap_scan" key.
  zap-baseline-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ZAP baseline (aster-lang.cloud)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://aster-lang.cloud
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap_baseline_cloud

  zap-baseline-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ZAP baseline (policy.aster-lang.dev)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://policy.aster-lang.dev
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap_baseline_api

  # Authenticated scan — exercises post-login routes that the
  # baseline scans can't reach. Needs a service-account credential
  # plus a ZAP context file that tells the scanner how to log in.
  #
  # Pre-requisites (one-time operator setup):
  #   - Seed a service account user `security-scan@aster-lang.cloud`
  #     in production with a strong password stored as a GitHub
  #     secret ZAP_SCAN_USER_PASSWORD. The account is tagged
  #     `isSecurityScan=true` so all writes from it are sandboxed
  #     and audit-tagged (see docs/runbooks/secrets-rotation.md
  #     for rotation procedure).
  #   - The ZAP context file in .github/zap/auth-context.xml lists
  #     the routes we want walked (dashboard, policies, settings,
  #     admin) and tells ZAP to use form auth at /api/auth/signin.
  #
  # The scan is throttled hard (rate-limit 5 req/s) so it doesn't
  # masquerade as abuse — the service account would otherwise hit
  # ApiQuotaGuard / Stripe usage tracking.
  #
  # fail_action: false — like the baseline jobs, this is warn-only.
  # Triage happens via the uploaded HTML report; failures here would
  # block deploy cadence too aggressively.
  zap-authenticated-cloud:
    runs-on: ubuntu-latest
    # P0-R16: GitHub Actions 禁止 ${{ secrets.X }} 出现在 job-level if 表达式,
    # 之前的 `if: ${{ secrets.ZAP_SCAN_USER_PASSWORD != '' }}` 让 GitHub 在
    # workflow listing 阶段 (push event 触发刷新时) 报 parse warning, 表现为
    # 每次 push 都在 Actions UI 上看到一个 0s 失败的 "security-scan.yml" 条目
    # (event=push, jobs=[]), 即使本 workflow 没声明 push 触发器. 改成 step-level
    # gate: job 总是 dispatch, 但首个步骤检测 secret 缺失则提前 exit 0 跳过.
    steps:
      - name: Check ZAP_SCAN_USER_PASSWORD presence
        id: gate
        run: |
          if [ -z "${{ secrets.ZAP_SCAN_USER_PASSWORD }}" ]; then
            echo "ZAP_SCAN_USER_PASSWORD not set; skipping authenticated scan"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
      - name: ZAP authenticated scan (aster-lang.cloud)
        if: steps.gate.outputs.skip != 'true'
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: https://aster-lang.cloud
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap_authenticated_cloud
          cmd_options: >-
            -n /zap/wrk/auth-context.xml
            -U security-scan@aster-lang.cloud
            -m 5
            -T 30
          rules_file_name: .github/zap/rules.tsv
        env:
          # ZAP picks up the password via the context file's
          # ${ZAP_AUTH_PASSWORD} placeholder substitution. Keeping
          # it out of the context XML means we don't commit the
          # value-shape, only the substitution variable.
          ZAP_AUTH_PASSWORD: ${{ secrets.ZAP_SCAN_USER_PASSWORD }}
