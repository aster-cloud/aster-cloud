name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # P0-R6 (codex round 6): vendor tarball SLA enforcement
      # 如果 package.json 仍含 file:vendor/... 依赖，必须有 vendor/README.md
      # 且包含 Owner + 删除条件。防止 tarball 成为永久技术债。
      #
      # P0-R11 升级：对 @aster-cloud/aster-lang-ts 的 vendor tarball 增加
      # **内容契约**——必须包含 R6 跨运行时 PII flow analysis 修复的关键
      # 函数（isProductionRuntime / __setPiiCheckerForTest /
      # __isProductionRuntimeForTest / PII_ANALYZER_FAILED）。
      # 防止 tarball 被替换/降级回退到无 PII guard 的旧版本。
      - name: Vendor tarball SLA enforcement
        run: |
          set -e
          if grep -q "file:vendor/" package.json; then
            echo "Detected file:vendor/ dependency. Checking SLA documentation..."
            if [ ! -f vendor/README.md ]; then
              echo "ERROR: file:vendor/ dependency requires vendor/README.md"
              exit 1
            fi
            if ! grep -q "Owner:" vendor/README.md; then
              echo "ERROR: vendor/README.md must declare an Owner"
              exit 1
            fi
            if ! grep -q "删除条件\|Removal Conditions\|临时 SLA" vendor/README.md; then
              echo "ERROR: vendor/README.md must declare removal conditions / SLA"
              exit 1
            fi
            echo "OK: vendor/ SLA documentation present"
          fi

          # aster-lang-ts tarball 内容合同（ADR-0009 R6 跨运行时 PII flow analysis）
          #
          # P0-R12 升级（codex round 12 反馈）：单纯 grep 符号能证明"看起来像 R6"，
          # 不能证明"真的执行 R6"。补强为同时检查：
          #   (a) 函数定义在场       — isProductionRuntime / __setPiiCheckerForTest /
          #                            __isProductionRuntimeForTest
          #   (b) 执行入口被调用      — isProductionRuntime() 必须在 __setPiiCheckerForTest
          #                            的实现里被调用（call site，不只是定义）
          #   (c) E404/PII_ANALYZER_FAILED 错误码在场（说明 catch 路径已编译进 bundle）
          #   (d) checkModule 调用入口 — typecheck PII 流程的真实入口存在
          #
          # 防止"tarball 被替换为 stub/旧版本"或"代码注释掉但符号还在"的退步。
          ASTER_TARBALL=$(ls vendor/aster-cloud-aster-lang-ts-*.tgz 2>/dev/null || true)
          if [ -n "$ASTER_TARBALL" ]; then
            echo "Verifying $ASTER_TARBALL contains ADR-0009 R6 fixes..."
            BROWSER_JS=$(tar -xzOf "$ASTER_TARBALL" package/dist/src/typecheck/browser.js 2>/dev/null || echo "")
            if [ -z "$BROWSER_JS" ]; then
              echo "ERROR: tarball missing package/dist/src/typecheck/browser.js"
              exit 1
            fi
            # (a) 关键函数定义在场
            for SYMBOL in "isProductionRuntime" "__setPiiCheckerForTest" "__isProductionRuntimeForTest"; do
              if ! echo "$BROWSER_JS" | grep -q "$SYMBOL"; then
                echo "ERROR: tarball browser.js missing function '$SYMBOL' (R6 cross-runtime PII fix regression)"
                exit 1
              fi
            done
            # (b) production guard 真正在 __setPiiCheckerForTest 内被调用——
            # 不只定义，必须 call site 位于 setter 函数体内。
            # 用 awk 提取 function __setPiiCheckerForTest(...) { ... } 范围内的
            # 文本，再 grep isProductionRuntime() —— 这样能挡住"setter 定义了但
            # 函数体被注释/简化为 no-op"的退步。
            SETTER_BODY=$(echo "$BROWSER_JS" | awk '
              /function __setPiiCheckerForTest/ { in_fn=1; depth=0 }
              in_fn {
                print;
                for (i=1; i<=length($0); i++) {
                  c=substr($0, i, 1);
                  if (c=="{") depth++;
                  else if (c=="}") {
                    depth--;
                    if (depth==0) { in_fn=0; exit }
                  }
                }
              }
            ')
            if [ -z "$SETTER_BODY" ]; then
              echo "ERROR: tarball browser.js: cannot extract __setPiiCheckerForTest function body"
              exit 1
            fi
            if ! echo "$SETTER_BODY" | grep -q "isProductionRuntime()"; then
              echo "ERROR: __setPiiCheckerForTest body missing isProductionRuntime() call (guard inert)"
              echo "Body extracted:"
              echo "$SETTER_BODY" | head -20
              exit 1
            fi
            # (c) PII_ANALYZER_FAILED 错误码 + E404 字面量在场（catch 路径编译进 bundle）
            if ! echo "$BROWSER_JS" | grep -q "PII_ANALYZER_FAILED"; then
              echo "ERROR: tarball browser.js missing PII_ANALYZER_FAILED (E404 catch path regression)"
              exit 1
            fi
            if ! echo "$BROWSER_JS" | grep -q '"E404"'; then
              echo "ERROR: tarball browser.js missing E404 literal (catch path emit code regression)"
              exit 1
            fi
            # (d) checkModulePII / defaultCheckModulePII 真实入口在场——
            # 说明 PII 流程没被注释成 no-op
            if ! echo "$BROWSER_JS" | grep -qE "checkModulePII|defaultCheckModulePII|PiiTypeChecker"; then
              echo "ERROR: tarball browser.js missing PII checker entry (PII flow analysis disabled)"
              exit 1
            fi

            # (e) P0-R14/R15：typecheck-pii.js 不得 import server-side typecheck.js
            # 或 typecheck/utils.js (R15 codex round 14 review: utils.ts 含
            # require('node:module'), 不是干净 leaf). 必须 import 自纯 leaf
            # typecheck/alias.js (R14 起 resolveAlias 从这里 export).
            #
            # 否则 transitively 拉入 typecheck/module.js → node:fs/path/perf_hooks，
            # webpack edge target / Next.js browser bundle build 会炸 UnhandledSchemeError.
            # 这是 R13 通过后才发现的 critical build regression（CI 实际跑出来；
            # 本地 pnpm test:run 不走 webpack edge build 故而盲点）。
            PII_JS=$(tar -xzOf "$ASTER_TARBALL" package/dist/src/typecheck-pii.js 2>/dev/null || echo "")
            if [ -z "$PII_JS" ]; then
              echo "ERROR: tarball missing package/dist/src/typecheck-pii.js"
              exit 1
            fi
            # 必须 import 自 './typecheck/alias.js' (纯 leaf, 无 Node 依赖)
            # 不得 import './typecheck.js' (server entry) 或 './typecheck/utils.js'
            # (含 require('node:module'))
            if echo "$PII_JS" | grep -E "from[[:space:]]+['\"]\\./typecheck\\.js['\"]" >/dev/null; then
              echo "ERROR: typecheck-pii.js imports server-side typecheck.js — will pull node:fs/perf_hooks into edge bundle"
              exit 1
            fi
            if echo "$PII_JS" | grep -E "from[[:space:]]+['\"]\\./typecheck/utils\\.js['\"]" >/dev/null; then
              echo "ERROR: typecheck-pii.js imports typecheck/utils.js — utils.js contains require('node:module'); use typecheck/alias.js (pure leaf)"
              exit 1
            fi
            if ! echo "$PII_JS" | grep -E "from[[:space:]]+['\"]\\./typecheck/alias\\.js['\"]" >/dev/null; then
              echo "ERROR: typecheck-pii.js must import resolveAlias from './typecheck/alias.js' (pure leaf module, R15)"
              exit 1
            fi

            echo "OK: tarball content contract satisfied — R6 PII fixes present + call sites verified + edge bundle safety (R15 pure leaf)"
          fi

      # P0-R16: consumer-side artifact-level scan (closes R15 codex round 15 Low).
      # lang-ts CI 在 pack 前扫描 own dist; 但如果 vendor tarball 被替换 (e.g.
      # 旧版本回退), lang-ts CI 看不到. 这一步扫 node_modules/@aster-cloud/
      # aster-lang-ts/dist/src/browser.js 的 transitive closure, 确认消费侧
      # 实际收到的 browser entry 闭包不含 node:* / bare Node builtin.
      # 三层契约闭环: lang-ts dist 扫描 + tarball symbol contract + consumer 闭包扫描.
      - name: Verify vendor browser entry has no Node builtin deps
        run: node scripts/verify-vendor-browser-entry.mjs

      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      # #98: the standalone LSP image must pin the same compiler version as the
      # app, else the deployed language server runs a stale compiler.
      - name: LSP compiler pin matches app
        run: pnpm run check:lsp-pin
      # #98: .env.production is bundled to the client — only NEXT_PUBLIC_* allowed.
      - name: .env.production has only NEXT_PUBLIC_* keys
        run: pnpm run check:env-production
      - name: Verify message catalog parity (en backbone)
        run: pnpm run check:locales:strict
      # #98: report partial-locale coverage (hi shipped ~7%). Non-blocking —
      # the threshold is a product decision; deep-merge fallback prevents crashes.
      - name: Locale coverage report (non-blocking)
        run: pnpm run check:locale-coverage
        continue-on-error: true
      # Route ownership contract (ADR 0014). Two checks:
      #   1. routes:build must be a no-op — the committed
      #      public/.well-known/routes.json must match what the
      #      generator produces from config/routes.yaml.
      #   2. routes:check verifies every src/app/[locale]/page.tsx
      #      and every src/app/api/route.ts has a manifest entry, and
      #      every manifest entry with `source:` resolves to a real file.
      # Phase 3 will add cross-site link validation against
      # aster-lang-dev's manifest snapshot.
      - name: Route ownership — generated JSON is up to date
        run: |
          pnpm run routes:build
          git diff --exit-code public/.well-known/routes.json
      - name: Route ownership — coverage
        run: pnpm run routes:check
      # Every docs MDX page must carry a non-empty frontmatter `description:`
      # so generateMetadata emits a real <meta name="description"> (SEO +
      # social-share cards). A live Lighthouse audit found all 25 routes
      # (75 localized MDX files: 25 × en/zh/de) shipping blank meta
      # descriptions. `--check` parses the YAML frontmatter and fails if any
      # file is missing or has an empty/whitespace description; run
      # `pnpm docs:descriptions` to backfill from the page's first prose
      # paragraph.
      - name: Docs — every page has a meta description
        run: pnpm run check:docs-descriptions
      # The committed Cmd+K search index (src/lib/docs/search-index.*.json) is
      # generated from the docs MDX by build-docs-index.mjs. --check rebuilds
      # in memory and compares against the committed files WITHOUT writing
      # (side-effect-free), failing if they drift — a docs edit (e.g. a
      # changed description/heading) that forgets to commit the rebuilt index
      # would otherwise serve a stale index at runtime. Run
      # `pnpm docs:index:build` and commit the result to fix.
      - name: Docs — search index is up to date
        run: pnpm run check:docs-index
      # Glossary Contract (v7) — Stage 1 of 4-stage remediation: report-only.
      # See .claude/plan/glossary-contract.md §4.4 + glossary.config.yaml.
      # Flips to `check:glossary:strict` in Stage 4 once findings reach zero.
      - name: Glossary contract (Stage 1 — report-only)
        run: pnpm run check:glossary || true
        continue-on-error: true
      # report-only 诊断制品：上传仅供查阅，绝不应阻塞构建。
      # actions/upload-artifact 在组织级存储配额耗尽时会硬失败
      # （"Artifact storage quota has been hit"），该失败会传播并挂掉
      # build job——但 glossary findings 是 Stage 1 报告，不是质量门。
      # continue-on-error 把配额/基础设施抖动降级为非致命，门禁仍由
      # tsc/lint/test/on-prem-build 把守。
      - name: Upload glossary findings artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: glossary-findings
          path: glossary-findings.json
          if-no-files-found: ignore
      # PR-10: pnpm test:run 通过 vitest.config.ts 的 projects 配置自动跑
      # SaaS + on-prem 两种 deployment-mode。单 vitest 进程 + 共享 vite
      # cache，避免 fork 开销；总时间约为单模式的 2 倍（断言数翻倍，
      # ~9s → ~17s）—— 这是测试覆盖换来的可接受成本。
      - name: Run tests (saas + on-prem projects)
        run: pnpm test:run
      # 仅在 coverage provider 已安装时跑（可选，不阻塞 CI）。
      # Coverage 仅 saas project 收集 —— vitest.config.ts 注释解释为何。
      - name: Coverage (optional, saas project only)
        run: pnpm test:coverage --reporter=verbose || echo "::warning::Coverage skipped (install @vitest/coverage-v8 to enable)"
        continue-on-error: true
      - run: pnpm run build:next

      - name: Upload coverage to Codecov
        # Codecov v5+ requires a token even on public repos via the GHA;
        # token is optional but recommended. Skip the step entirely when
        # no token is configured to avoid the "failed to upload" warning
        # — coverage upload is non-blocking either way.
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Check Drizzle schema drift
        run: |
          pnpm db:generate 2>/dev/null || true
          if [ -n "$(git diff --name-only drizzle/)" ]; then
            echo "::error::Drizzle schema drift detected. Run 'pnpm db:generate' and commit the migration files."
            git diff drizzle/
            exit 1
          fi

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: aster-cloud-test-results
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore

  # E2E smoke — boots `next start` in background and runs the
  # vitest.e2e suite against it. Catches:
  #   - middleware redirect regressions (the next-intl loop we hit
  #     in the May 2026 standalone deploy)
  #   - server-rendered i18n drift on landing / pricing / hero
  #   - authenticated-route gate (login redirect)
  # Runs in parallel with `build` so failures here don't block the
  # SaaS bundle artifact going through.
  #
  # Uses `pnpm build:next && pnpm start` (not `pnpm dev`) so we test
  # the production-shaped server, not the dev hot-reload bundle.
  # Production shape catches issues like the standalone server.js
  # NODE_ENV hardcode that dev mode never hits.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build production bundle for e2e
        # SaaS build path. We're not testing the on-prem variant here;
        # the on-prem-build job already verifies that bundle doesn't
        # bundle SaaS SDKs.
        run: pnpm build:next

      - name: Start production server
        run: |
          # Standalone output goes to .next/standalone — copy static/
          # + public/ next to it so the server can serve them.
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          # Start in background. Hostname 127.0.0.1 so it doesn't
          # try to bind to ::1 on dual-stack runners.
          (cd .next/standalone && PORT=3001 HOSTNAME=127.0.0.1 \
            DEPLOYMENT_MODE=saas \
            DATABASE_URL='postgresql://noop:noop@localhost:5432/noop' \
            AUTH_SECRET='ci-e2e-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' \
            NEXTAUTH_SECRET='ci-e2e-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' \
            CRON_SECRET='ci-e2e-cron' \
            NEXT_PUBLIC_APP_URL='http://localhost:3001' \
            NEXTAUTH_URL='http://localhost:3001' \
            ASTER_PLAN_GATE_HMAC_KEY='ci-e2e-hmac' \
            node server.js > /tmp/e2e-server.log 2>&1 &)
          # Wait up to 30s for the server to accept requests. Probe / —
          # next-intl rewrites it to /en internally and serves SSR
          # within ~3s on a cold-start GitHub runner.
          for i in $(seq 1 30); do
            sleep 1
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/ || echo 000)
            if [ "$code" = "200" ] || [ "$code" = "307" ]; then
              echo "server ready (HTTP $code) after ${i}s"
              break
            fi
          done

      - name: Run e2e suite
        env:
          E2E_BASE_URL: http://localhost:3001
        run: pnpm test:e2e

      - name: Upload server log on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-log
          path: /tmp/e2e-server.log
          if-no-files-found: ignore

  # Cloudflare's git integration auto-deploys from main on every push,
  # so there is no GitHub Actions deploy job here. (Previous attempts to
  # add one created two parallel deploys racing for the same Worker.)
  # Operator: configure deploys at
  # https://dash.cloudflare.com/?to=/:account/workers/services/view/aster-cloud
  # The git build must set CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE
  # to any non-empty placeholder (e.g. postgres://placeholder) — wrangler
  # 4.92's deploy preflight reads it even though prod uses the bound
  # Hyperdrive at runtime. Without this dummy value, OpenNext's deploy
  # wrapper aborts with "no local hyperdrive connection string".

  # On-prem build verification — ensures the deployment-mode flag work
  # (v2 plan) is not regressed by future PRs. Runs in parallel with `build`.
  #
  # 失败常见原因 & 修复方向（按 verify scripts 输出的规则名）：
  #   "stripe import"          → src/lib/stripe.ts hot-gate 或 alias 失效
  #   "STRIPE_SECRET_KEY literal" → 某 SaaS-only 路由的 env 访问没用直接
  #                                 __DEPLOYMENT_MODE__ macro 守门
  #   "href to /billing"       → 某 client 组件加了 SaaS-only 链接但忘了
  #                              wrap CLIENT_CAPABILITIES.billing
  # 详见 .claude/plan/saas-only-inventory.md §17 PR-4 checklist。
  on-prem-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: On-prem build
        env:
          DEPLOYMENT_MODE: on-prem
        run: pnpm build

      - name: Verify on-prem bundle does not bundle SaaS SDKs / secrets
        run: pnpm verify:on-prem-bundle

      - name: Verify on-prem UI does not link to SaaS-only routes
        run: pnpm verify:on-prem-ui

      - name: Audit transitive deps in on-prem build (informational)
        run: pnpm verify:packages
        continue-on-error: true

      - name: Upload on-prem build artifacts on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: on-prem-build-failed
          path: |
            .open-next/worker.js
            .open-next/server-functions/default/handler.mjs
          if-no-files-found: ignore
          retention-days: 7

  build-migrate-image:
    # 仅在 main 分支 push 时跑（PR 不构建/推镜像）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 必须等 SaaS build + on-prem build 都过，才推 migrate 镜像 ——
    # 防止 on-prem 回归被推到 production
    needs: [build, on-prem-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/wontlost/aster-cloud-migrate:${{ github.sha }}
            docker.io/wontlost/aster-cloud-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger ArgoCD sync to pick up new migrate image
        if: success()
        env:
          ARGOCD_SERVER: argocd.aster-lang.cloud
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          if [ -z "$ARGOCD_AUTH_TOKEN" ]; then
            echo "ARGOCD_AUTH_TOKEN not set; skipping auto-sync"
            exit 0
          fi
          # 重启 aster-cloud Application 让 PreSync hook 重新触发 Job
          curl -fsSL -X POST \
            -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
            "https://$ARGOCD_SERVER/api/v1/applications/aster-cloud/sync" \
            -d '{"revision":"main"}' || echo "::warning::ArgoCD sync trigger failed; migration will run on next sync"
