name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref 上新 push 到来时取消尚在跑的过时 CI（PR 连续 push 常见）——省算力/排队。
# ★cancel-in-progress 只对 PR 生效（Codex 审 High）：main push 的 build-migrate-image job
# 有副作用（推 migrate 镜像 + 触发 ArgoCD sync），若被后续 push 取消会导致迁移镜像丢失 /
# app-migration 不一致窗口。故 main 上的 run 必须跑完，绝不取消。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # ADR-0009 消费侧 artifact 合同：扫**实际安装的** @aster-cloud/aster-lang-ts npm 包——
      #   (1) browser entry 闭包无 node:*/bare Node builtin（edge bundle 安全）
      #   (2) PII 跨运行时守卫符号+call-site 在场 + typecheck-pii.js 走纯 leaf alias（防降级到无守卫旧版）
      # 信任边界异于 lang-ts CI 的 pre-pack 扫描（验「装进 node_modules 的包」非「发布源构建」）。
      # vendor tarball（npm 发布凭证缺失期的 file:vendor 应急方案）已于 npm 1.0.6 退役——
      # 原「Vendor tarball SLA enforcement」step 的 PII 内容契约已合并进本 verifier。
      - name: Verify installed aster-lang-ts browser artifact (edge-safe + ADR-0009 PII)
        run: node scripts/verify-aster-lang-browser-artifact.mjs

      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      # #98: the standalone LSP image must pin the same compiler version as the
      # app, else the deployed language server runs a stale compiler.
      - name: LSP compiler pin matches app
        run: pnpm run check:lsp-pin
      # #98: .env.production is bundled to the client — only NEXT_PUBLIC_* allowed.
      - name: .env.production has only NEXT_PUBLIC_* keys
        run: pnpm run check:env-production
      - name: Verify message catalog parity (en backbone)
        run: pnpm run check:locales:strict
      # #98: report partial-locale coverage (hi shipped ~7%). Non-blocking —
      # the threshold is a product decision; deep-merge fallback prevents crashes.
      - name: Locale coverage report (non-blocking)
        run: pnpm run check:locale-coverage
        continue-on-error: true
      # Route ownership contract (ADR 0014). Two checks:
      #   1. routes:build must be a no-op — the committed
      #      public/.well-known/routes.json must match what the
      #      generator produces from config/routes.yaml.
      #   2. routes:check verifies every src/app/[locale]/page.tsx
      #      and every src/app/api/route.ts has a manifest entry, and
      #      every manifest entry with `source:` resolves to a real file.
      # Phase 3 will add cross-site link validation against
      # aster-lang-dev's manifest snapshot.
      - name: Route ownership — generated JSON is up to date
        run: |
          pnpm run routes:build
          git diff --exit-code public/.well-known/routes.json
      - name: Route ownership — coverage
        run: pnpm run routes:check
      # Every docs MDX page must carry a non-empty frontmatter `description:`
      # so generateMetadata emits a real <meta name="description"> (SEO +
      # social-share cards). A live Lighthouse audit found all 25 routes
      # (75 localized MDX files: 25 × en/zh/de) shipping blank meta
      # descriptions. `--check` parses the YAML frontmatter and fails if any
      # file is missing or has an empty/whitespace description; run
      # `pnpm docs:descriptions` to backfill from the page's first prose
      # paragraph.
      - name: Docs — every page has a meta description
        run: pnpm run check:docs-descriptions
      # The committed Cmd+K search index (src/lib/docs/search-index.*.json) is
      # generated from the docs MDX by build-docs-index.mjs. --check rebuilds
      # in memory and compares against the committed files WITHOUT writing
      # (side-effect-free), failing if they drift — a docs edit (e.g. a
      # changed description/heading) that forgets to commit the rebuilt index
      # would otherwise serve a stale index at runtime. Run
      # `pnpm docs:index:build` and commit the result to fix.
      - name: Docs — search index is up to date
        run: pnpm run check:docs-index
      # Glossary Contract (v7) — Stage 1 of 4-stage remediation: report-only.
      # See .claude/plan/glossary-contract.md §4.4 + glossary.config.yaml.
      # Flips to `check:glossary:strict` in Stage 4 once findings reach zero.
      - name: Glossary contract (Stage 1 — report-only)
        run: pnpm run check:glossary || true
        continue-on-error: true
      # report-only 诊断制品：上传仅供查阅，绝不应阻塞构建。
      # actions/upload-artifact 在组织级存储配额耗尽时会硬失败
      # （"Artifact storage quota has been hit"），该失败会传播并挂掉
      # build job——但 glossary findings 是 Stage 1 报告，不是质量门。
      # continue-on-error 把配额/基础设施抖动降级为非致命，门禁仍由
      # tsc/lint/test/on-prem-build 把守。
      - name: Upload glossary findings artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: glossary-findings
          path: glossary-findings.json
          if-no-files-found: ignore
      # PR-10: pnpm test:run 通过 vitest.config.ts 的 projects 配置自动跑
      # SaaS + on-prem 两种 deployment-mode。单 vitest 进程 + 共享 vite
      # cache，避免 fork 开销；总时间约为单模式的 2 倍（断言数翻倍，
      # ~9s → ~17s）—— 这是测试覆盖换来的可接受成本。
      - name: Run tests (saas + on-prem projects)
        run: pnpm test:run
      # 仅在 coverage provider 已安装时跑（可选，不阻塞 CI）。
      # Coverage 仅 saas project 收集 —— vitest.config.ts 注释解释为何。
      - name: Coverage (optional, saas project only)
        run: pnpm test:coverage --reporter=verbose || echo "::warning::Coverage skipped (install @vitest/coverage-v8 to enable)"
        continue-on-error: true

      # Drizzle drift 检查独立于 next build，前移到 build:next **之前**（Codex 审 Medium）：
      # 否则 drift 失败会在已产出/上传 standalone artifact 之后才 fail，白占存储。
      - name: Check Drizzle schema drift
        run: |
          pnpm db:generate 2>/dev/null || true
          if [ -n "$(git diff --name-only drizzle/)" ]; then
            echo "::error::Drizzle schema drift detected. Run 'pnpm db:generate' and commit the migration files."
            git diff drizzle/
            exit 1
          fi

      - run: pnpm run build:next

      # 复用 build 产物给 e2e job（时长优化）：原来 e2e job `needs: build` 却抛弃产物
      # 重新 `pnpm build:next`（~150s 重复）。改为这里把 standalone 产物打成单个 tar
      # 上传，e2e 下载解包复用。
      #
      # ★为何用 tar 而非 upload-artifact 直传目录：Next standalone 的
      # node_modules/next 等是 **symlink**（指向 standalone 内部的 .pnpm/）。
      # upload-artifact 逐文件上传对 symlink 跨 artifact 还原行为不可靠，且数千小文件
      # 上传/下载开销大。tar 原生保留 symlink 拓扑 + 单文件传输，既正确又更快。
      # 预先把 static/public 组装进 standalone（e2e Start server 原本做的 cp），
      # 打进同一 tar，e2e 端解包即用。
      - name: Package standalone build for e2e reuse
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          # ★symlink invariant 检查（Codex 审 Low）：standalone 的依赖是 symlink（指向内部
          # .pnpm/）。tar 只保拓扑，若未来 pnpm/Next tracing 变化产出**逃出 .next/standalone**
          # 的 symlink（如指向仓库根 node_modules），解包到别的 job 就会缺依赖。打包前断言
          # 所有 symlink 目标都落在 standalone 内，否则立即失败（宁可 CI 红，不发坏包）。
          ROOT="$(cd .next/standalone && pwd)"
          bad=0
          while IFS= read -r link; do
            tgt="$(python3 -c "import os,sys; print(os.path.realpath(sys.argv[1]))" "$link")"
            case "$tgt" in
              "$ROOT"/*) : ;;
              *) echo "::error::standalone symlink 逃出打包根: $link -> $tgt"; bad=1 ;;
            esac
          done < <(find .next/standalone -type l)
          [ "$bad" = "0" ] || { echo "::error::standalone 含逃逸 symlink，拒绝打包（避免 e2e 缺依赖）"; exit 1; }
          test -e .next/standalone/node_modules/next || { echo "::error::standalone/node_modules/next 不可解析"; exit 1; }
          # ★压缩用 zstd -1 而非 gzip：standalone 多为已压缩/压缩不友好的 js chunk + node_modules，
          # zstd -1 与 gzip 默认压缩率相当（同 ~17M）但打包快 ~40%（本地 72M 样本 3.4s→1.9s，
          # GH runner 慢 CPU 上差距更大）。ubuntu-latest 自带 zstd。tar 仍保 symlink 拓扑。
          tar --use-compress-program='zstd -1' -cf standalone.tar.zst -C .next standalone
          echo "standalone.tar.zst size: $(du -h standalone.tar.zst | cut -f1)"

      - name: Upload standalone tarball for e2e reuse
        uses: actions/upload-artifact@v7
        with:
          name: next-standalone
          path: standalone.tar.zst
          if-no-files-found: error
          retention-days: 1

      - name: Upload coverage to Codecov
        # Codecov v5+ requires a token even on public repos via the GHA;
        # token is optional but recommended. Skip the step entirely when
        # no token is configured to avoid the "failed to upload" warning
        # — coverage upload is non-blocking either way.
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: aster-cloud-test-results
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore

  # E2E smoke — boots `next start` in background and runs the
  # vitest.e2e suite against it. Catches:
  #   - middleware redirect regressions (the next-intl loop we hit
  #     in the May 2026 standalone deploy)
  #   - server-rendered i18n drift on landing / pricing / hero
  #   - authenticated-route gate (login redirect)
  #
  # 时长优化后 `needs: build`——**复用** build job 打包的 standalone 产物（不再原地重新
  # build，省 ~150s）。因此 e2e 不再与 build 并行，而是串在其后；代价是 wall-clock 上
  # e2e 等 build 完成，但省掉的整个重复 build 远大于此。
  #
  # 测的是 production-shaped standalone server（`node server.js`，非 dev hot-reload），
  # 能抓 standalone server.js NODE_ENV hardcode 这类 dev 模式碰不到的问题。
  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      # 仍需 install：e2e 用 vitest 跑测试（devDependency，standalone 产物不含）。
      # 但**不再** build——复用 build job 打包的 standalone 产物（省 ~150s 重复 build）。
      - run: pnpm install --frozen-lockfile

      - name: Download + unpack standalone build from build job
        uses: actions/download-artifact@v8
        with:
          name: next-standalone
          path: .
      - name: Unpack standalone tarball
        run: |
          # 解包还原 .next/standalone（含已组装的 .next/static + public + symlink 依赖）。
          # 与 build job 一致用 zstd（tar 自动识别 .zst 扩展调 zstd 解压，ubuntu-latest 自带）。
          mkdir -p .next
          tar --use-compress-program='zstd -d' -xf standalone.tar.zst -C .next
          test -f .next/standalone/server.js || { echo "::error::standalone/server.js 缺失，解包异常"; exit 1; }

      - name: Start production server
        run: |
          # standalone 已由 build job 组装好 static/public（打进 tar），此处直接启动。
          # Start in background. Hostname 127.0.0.1 so it doesn't
          # try to bind to ::1 on dual-stack runners.
          #
          # ★注入全套 dummy SaaS env（Codex 审 High）：standalone server.js 保留外部
          # NODE_ENV，runner 未设时落到 production → src/instrumentation.ts 调
          # validateEnvOrThrow() 校验 SaaS 必填项（DATABASE/AUTH/CRON/APP_URL/HMAC +
          # STRIPE_SECRET/WEBHOOK + 6 个 STRIPE PRICE_ID + MIXPANEL + RESEND）。缺任一即
          # throw、instrumentation 崩、server 起不来。这些是编译期无关的 runtime 占位值，
          # 只为让 production-shaped server 通过 env 闸门启动（不接真实 Stripe/Mixpanel）。
          (cd .next/standalone && PORT=3001 HOSTNAME=127.0.0.1 \
            DEPLOYMENT_MODE=saas \
            DATABASE_URL='postgresql://noop:noop@localhost:5432/noop' \
            AUTH_SECRET='ci-e2e-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' \
            NEXTAUTH_SECRET='ci-e2e-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' \
            CRON_SECRET='ci-e2e-cron' \
            NEXT_PUBLIC_APP_URL='http://localhost:3001' \
            NEXTAUTH_URL='http://localhost:3001' \
            ASTER_PLAN_GATE_HMAC_KEY='ci-e2e-hmac' \
            STRIPE_SECRET_KEY='sk_test_ci_e2e_placeholder' \
            STRIPE_WEBHOOK_SECRET='whsec_ci_e2e_placeholder' \
            NEXT_PUBLIC_STRIPE_PRO_MONTHLY_PRICE_ID='price_ci_e2e_m_usd' \
            NEXT_PUBLIC_STRIPE_PRO_YEARLY_PRICE_ID='price_ci_e2e_y_usd' \
            NEXT_PUBLIC_STRIPE_PRO_MONTHLY_CNY_PRICE_ID='price_ci_e2e_m_cny' \
            NEXT_PUBLIC_STRIPE_PRO_YEARLY_CNY_PRICE_ID='price_ci_e2e_y_cny' \
            NEXT_PUBLIC_STRIPE_PRO_MONTHLY_EUR_PRICE_ID='price_ci_e2e_m_eur' \
            NEXT_PUBLIC_STRIPE_PRO_YEARLY_EUR_PRICE_ID='price_ci_e2e_y_eur' \
            NEXT_PUBLIC_MIXPANEL_TOKEN='ci_e2e_mixpanel_token' \
            RESEND_API_KEY='re_ci_e2e_placeholder' \
            node server.js > /tmp/e2e-server.log 2>&1 &)
          # Wait up to 30s for the server to accept requests. Probe / —
          # next-intl rewrites it to /en internally and serves SSR
          # within ~3s on a cold-start GitHub runner.
          # ★readiness 硬失败（Codex 审 High）：原版循环 30 次后即使 server 没起来也不
          # exit 1，而 test:e2e 用 skipIf(!serverReachable) → server 起不来会静默 0-test
          # 假绿，掩盖 artifact 复用坏包 / env throw / 端口问题。改为超时即打印 server log
          # 并 exit 1，让 e2e 真正证明「复用的 standalone 产物能启动」。
          ready=0
          for i in $(seq 1 30); do
            sleep 1
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/ || echo 000)
            if [ "$code" = "200" ] || [ "$code" = "307" ]; then
              echo "server ready (HTTP $code) after ${i}s"
              ready=1
              break
            fi
          done
          if [ "$ready" != "1" ]; then
            echo "::error::e2e server 未在 30s 内就绪——复用的 standalone 产物可能启动失败。server log:"
            echo "::group::/tmp/e2e-server.log"
            cat /tmp/e2e-server.log || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Run e2e suite
        env:
          E2E_BASE_URL: http://localhost:3001
        run: pnpm test:e2e

      - name: Upload server log on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-log
          path: /tmp/e2e-server.log
          if-no-files-found: ignore

  # Cloudflare's git integration auto-deploys from main on every push,
  # so there is no GitHub Actions deploy job here. (Previous attempts to
  # add one created two parallel deploys racing for the same Worker.)
  # Operator: configure deploys at
  # https://dash.cloudflare.com/?to=/:account/workers/services/view/aster-cloud
  # The git build must set CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE
  # to any non-empty placeholder (e.g. postgres://placeholder) — wrangler
  # 4.92's deploy preflight reads it even though prod uses the bound
  # Hyperdrive at runtime. Without this dummy value, OpenNext's deploy
  # wrapper aborts with "no local hyperdrive connection string".

  # On-prem build verification — ensures the deployment-mode flag work
  # (v2 plan) is not regressed by future PRs. Runs in parallel with `build`.
  #
  # 失败常见原因 & 修复方向（按 verify scripts 输出的规则名）：
  #   "stripe import"          → src/lib/stripe.ts hot-gate 或 alias 失效
  #   "STRIPE_SECRET_KEY literal" → 某 SaaS-only 路由的 env 访问没用直接
  #                                 __DEPLOYMENT_MODE__ macro 守门
  #   "href to /billing"       → 某 client 组件加了 SaaS-only 链接但忘了
  #                              wrap CLIENT_CAPABILITIES.billing
  # 详见 .claude/plan/saas-only-inventory.md §17 PR-4 checklist。
  on-prem-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: On-prem build
        env:
          DEPLOYMENT_MODE: on-prem
        run: pnpm build

      - name: Verify on-prem bundle does not bundle SaaS SDKs / secrets
        run: pnpm verify:on-prem-bundle

      - name: Verify on-prem UI does not link to SaaS-only routes
        run: pnpm verify:on-prem-ui

      - name: Audit transitive deps in on-prem build (informational)
        run: pnpm verify:packages
        continue-on-error: true

      - name: Upload on-prem build artifacts on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: on-prem-build-failed
          path: |
            .open-next/worker.js
            .open-next/server-functions/default/handler.mjs
          if-no-files-found: ignore
          retention-days: 7

  build-migrate-image:
    # 仅在 main 分支 push 时跑（PR 不构建/推镜像）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 必须等 SaaS build + on-prem build 都过，才推 migrate 镜像 ——
    # 防止 on-prem 回归被推到 production
    needs: [build, on-prem-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/wontlost/aster-cloud-migrate:${{ github.sha }}
            docker.io/wontlost/aster-cloud-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger ArgoCD sync to run DB migration (fail-loud)
        if: success()
        env:
          ARGOCD_SERVER: argocd.aster-lang.cloud
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          # issue #187：此前 token 缺失就静默 `exit 0`，把"迁移从未应用"伪装成 CI 绿。
          # 迁移镜像用浮动 `:latest`、git manifest 不变 → ArgoCD automated selfHeal 不会检测到
          # drift、PostSync 迁移 hook 不会重跑，所以【必须】由本 step 主动触发一次 sync operation。
          # 该 step 失败 = 迁移没应用 = 必须可见（fail-loud），而不是假绿掩盖数据库落后。
          if [ -z "$ARGOCD_AUTH_TOKEN" ]; then
            echo "::error title=DB migration not applied::ARGOCD_AUTH_TOKEN 未配置。迁移镜像已推送但 ArgoCD sync 未触发，PostSync 迁移 hook 不会重跑 → 数据库停在旧版本。修复：配置仓库 secret ARGOCD_AUTH_TOKEN，或手动跑迁移 Job（k3s apps/aster-lang/cloud/migrate-job.yaml）。详见 issue #187。"
            exit 1
          fi
          # 触发 sync（--fail 让非 2xx 直接失败）；PostSync 迁移 hook 随本次 sync operation 重跑。
          if ! curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
              "https://$ARGOCD_SERVER/api/v1/applications/aster-cloud/sync" \
              -d '{"revision":"main"}'; then
            echo "::error title=ArgoCD sync failed::触发 ArgoCD sync 失败 → 迁移可能未应用。检查 ARGOCD_AUTH_TOKEN 有效性 / ArgoCD 可达性。详见 issue #187。"
            exit 1
          fi
          echo "ArgoCD sync 已触发，等待 operation 完成（含 PostSync 迁移 hook）..."
          # 轮询 operation 状态直到结束——CI 绿必须代表"迁移真的跑完成功"，而非只"sync 请求被接受"
          # （Codex 审查）。最多等 ~5min。
          for i in $(seq 1 30); do
            phase="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
              "https://$ARGOCD_SERVER/api/v1/applications/aster-cloud" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin).get("status",{}).get("operationState",{}).get("phase",""))' 2>/dev/null || echo "")"
            echo "  [$i] operation phase=${phase:-<none>}"
            case "$phase" in
              Succeeded) echo "✅ ArgoCD sync + 迁移 hook 成功"; exit 0 ;;
              Failed|Error) echo "::error title=ArgoCD sync/migration failed::ArgoCD operation phase=$phase → 迁移未成功应用。查看 ArgoCD UI 的 migrate PostSync hook 日志。详见 issue #187。"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error title=ArgoCD sync timeout::等待 ArgoCD operation 完成超时 → 迁移状态未知，需人工确认。详见 issue #187。"
          exit 1
