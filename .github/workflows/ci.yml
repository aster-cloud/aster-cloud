name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:run
      # 仅在 coverage provider 已安装时跑（可选，不阻塞 CI）
      - name: Coverage (optional)
        run: pnpm test:coverage --reporter=verbose || echo "::warning::Coverage skipped (install @vitest/coverage-v8 to enable)"
        continue-on-error: true
      - run: pnpm run build:next

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        continue-on-error: true

      - name: Check Drizzle schema drift
        run: |
          pnpm db:generate 2>/dev/null || true
          if [ -n "$(git diff --name-only drizzle/)" ]; then
            echo "::error::Drizzle schema drift detected. Run 'pnpm db:generate' and commit the migration files."
            git diff drizzle/
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aster-cloud-test-results
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore
