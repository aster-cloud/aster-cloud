name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - name: Verify message catalog parity (en backbone)
        run: pnpm run check:locales:strict
      - run: pnpm test:run
      # 仅在 coverage provider 已安装时跑（可选，不阻塞 CI）
      - name: Coverage (optional)
        run: pnpm test:coverage --reporter=verbose || echo "::warning::Coverage skipped (install @vitest/coverage-v8 to enable)"
        continue-on-error: true
      - run: pnpm run build:next

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        continue-on-error: true

      - name: Check Drizzle schema drift
        run: |
          pnpm db:generate 2>/dev/null || true
          if [ -n "$(git diff --name-only drizzle/)" ]; then
            echo "::error::Drizzle schema drift detected. Run 'pnpm db:generate' and commit the migration files."
            git diff drizzle/
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aster-cloud-test-results
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore

  deploy-worker:
    # main 分支 push 时部署 Cloudflare Worker。
    # 历史上没接 wrangler，导致 main 上的 fix 不会自动到 prod —— 见 2026-05-15
    # auth-denial / api-usage 修复推上去后用户仍报错的事故。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      # 同一时间只允许一个 deploy 跑；后到的 commit 取消先到的（取最新）
      group: cloudflare-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build Next.js + OpenNext bundle
        # opennextjs-cloudflare 把 .next 转换为 Cloudflare Worker 兼容格式，
        # 输出到 .open-next/。--skipNextBuild 复用上一步的 next build。
        run: |
          pnpm run build:next
          pnpm exec opennextjs-cloudflare build --skipNextBuild

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Force plain `wrangler deploy`. Without an explicit command, the
          # action runs `wrangler deploy` which OpenNext-aware wrangler
          # rewrites to `opennextjs-cloudflare deploy`. That wrapper calls
          # getPlatformProxy(), which tries to bind a local Hyperdrive
          # connection string and aborts the CI deploy with
          # "no local hyperdrive connection string". We've already produced
          # the OpenNext build in the previous step, so just push it.
          command: deploy --keep-vars

  build-migrate-image:
    # 仅在 main 分支 push 时跑（PR 不构建/推镜像）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/wontlost/aster-cloud-migrate:${{ github.sha }}
            docker.io/wontlost/aster-cloud-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger ArgoCD sync to pick up new migrate image
        if: success()
        env:
          ARGOCD_SERVER: argocd.aster-lang.cloud
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          if [ -z "$ARGOCD_AUTH_TOKEN" ]; then
            echo "ARGOCD_AUTH_TOKEN not set; skipping auto-sync"
            exit 0
          fi
          # 重启 aster-cloud Application 让 PreSync hook 重新触发 Job
          curl -fsSL -X POST \
            -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
            "https://$ARGOCD_SERVER/api/v1/applications/aster-cloud/sync" \
            -d '{"revision":"main"}' || echo "::warning::ArgoCD sync trigger failed; migration will run on next sync"
