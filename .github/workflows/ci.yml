name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # P0-R6 (codex round 6): vendor tarball SLA enforcement
      # 如果 package.json 仍含 file:vendor/... 依赖，必须有 vendor/README.md
      # 且包含 Owner + 删除条件。防止 tarball 成为永久技术债。
      - name: Vendor tarball SLA enforcement
        run: |
          set -e
          if grep -q "file:vendor/" package.json; then
            echo "Detected file:vendor/ dependency. Checking SLA documentation..."
            if [ ! -f vendor/README.md ]; then
              echo "ERROR: file:vendor/ dependency requires vendor/README.md"
              exit 1
            fi
            if ! grep -q "Owner:" vendor/README.md; then
              echo "ERROR: vendor/README.md must declare an Owner"
              exit 1
            fi
            if ! grep -q "删除条件\|Removal Conditions\|临时 SLA" vendor/README.md; then
              echo "ERROR: vendor/README.md must declare removal conditions / SLA"
              exit 1
            fi
            echo "OK: vendor/ SLA documentation present"
          fi

      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - name: Verify message catalog parity (en backbone)
        run: pnpm run check:locales:strict
      # Glossary Contract (v7) — Stage 1 of 4-stage remediation: report-only.
      # See .claude/plan/glossary-contract.md §4.4 + glossary.config.yaml.
      # Flips to `check:glossary:strict` in Stage 4 once findings reach zero.
      - name: Glossary contract (Stage 1 — report-only)
        run: pnpm run check:glossary || true
        continue-on-error: true
      - name: Upload glossary findings artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glossary-findings
          path: glossary-findings.json
          if-no-files-found: ignore
      # PR-10: pnpm test:run 通过 vitest.config.ts 的 projects 配置自动跑
      # SaaS + on-prem 两种 deployment-mode。单 vitest 进程 + 共享 vite
      # cache，避免 fork 开销；总时间约为单模式的 2 倍（断言数翻倍，
      # ~9s → ~17s）—— 这是测试覆盖换来的可接受成本。
      - name: Run tests (saas + on-prem projects)
        run: pnpm test:run
      # 仅在 coverage provider 已安装时跑（可选，不阻塞 CI）。
      # Coverage 仅 saas project 收集 —— vitest.config.ts 注释解释为何。
      - name: Coverage (optional, saas project only)
        run: pnpm test:coverage --reporter=verbose || echo "::warning::Coverage skipped (install @vitest/coverage-v8 to enable)"
        continue-on-error: true
      - run: pnpm run build:next

      - name: Upload coverage to Codecov
        # Codecov v5+ requires a token even on public repos via the GHA;
        # token is optional but recommended. Skip the step entirely when
        # no token is configured to avoid the "failed to upload" warning
        # — coverage upload is non-blocking either way.
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Check Drizzle schema drift
        run: |
          pnpm db:generate 2>/dev/null || true
          if [ -n "$(git diff --name-only drizzle/)" ]; then
            echo "::error::Drizzle schema drift detected. Run 'pnpm db:generate' and commit the migration files."
            git diff drizzle/
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aster-cloud-test-results
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore

  # E2E smoke — boots `next start` in background and runs the
  # vitest.e2e suite against it. Catches:
  #   - middleware redirect regressions (the next-intl loop we hit
  #     in the May 2026 standalone deploy)
  #   - server-rendered i18n drift on landing / pricing / hero
  #   - authenticated-route gate (login redirect)
  # Runs in parallel with `build` so failures here don't block the
  # SaaS bundle artifact going through.
  #
  # Uses `pnpm build:next && pnpm start` (not `pnpm dev`) so we test
  # the production-shaped server, not the dev hot-reload bundle.
  # Production shape catches issues like the standalone server.js
  # NODE_ENV hardcode that dev mode never hits.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build production bundle for e2e
        # SaaS build path. We're not testing the on-prem variant here;
        # the on-prem-build job already verifies that bundle doesn't
        # bundle SaaS SDKs.
        run: pnpm build:next

      - name: Start production server
        run: |
          # Standalone output goes to .next/standalone — copy static/
          # + public/ next to it so the server can serve them.
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          # Start in background. Hostname 127.0.0.1 so it doesn't
          # try to bind to ::1 on dual-stack runners.
          (cd .next/standalone && PORT=3001 HOSTNAME=127.0.0.1 \
            DEPLOYMENT_MODE=saas \
            DATABASE_URL='postgresql://noop:noop@localhost:5432/noop' \
            AUTH_SECRET='ci-e2e-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' \
            NEXTAUTH_SECRET='ci-e2e-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' \
            CRON_SECRET='ci-e2e-cron' \
            NEXT_PUBLIC_APP_URL='http://localhost:3001' \
            NEXTAUTH_URL='http://localhost:3001' \
            ASTER_PLAN_GATE_HMAC_KEY='ci-e2e-hmac' \
            node server.js > /tmp/e2e-server.log 2>&1 &)
          # Wait up to 30s for the server to accept requests. Probe / —
          # next-intl rewrites it to /en internally and serves SSR
          # within ~3s on a cold-start GitHub runner.
          for i in $(seq 1 30); do
            sleep 1
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/ || echo 000)
            if [ "$code" = "200" ] || [ "$code" = "307" ]; then
              echo "server ready (HTTP $code) after ${i}s"
              break
            fi
          done

      - name: Run e2e suite
        env:
          E2E_BASE_URL: http://localhost:3001
        run: pnpm test:e2e

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-log
          path: /tmp/e2e-server.log
          if-no-files-found: ignore

  # Cloudflare's git integration auto-deploys from main on every push,
  # so there is no GitHub Actions deploy job here. (Previous attempts to
  # add one created two parallel deploys racing for the same Worker.)
  # Operator: configure deploys at
  # https://dash.cloudflare.com/?to=/:account/workers/services/view/aster-cloud
  # The git build must set CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE
  # to any non-empty placeholder (e.g. postgres://placeholder) — wrangler
  # 4.92's deploy preflight reads it even though prod uses the bound
  # Hyperdrive at runtime. Without this dummy value, OpenNext's deploy
  # wrapper aborts with "no local hyperdrive connection string".

  # On-prem build verification — ensures the deployment-mode flag work
  # (v2 plan) is not regressed by future PRs. Runs in parallel with `build`.
  #
  # 失败常见原因 & 修复方向（按 verify scripts 输出的规则名）：
  #   "stripe import"          → src/lib/stripe.ts hot-gate 或 alias 失效
  #   "STRIPE_SECRET_KEY literal" → 某 SaaS-only 路由的 env 访问没用直接
  #                                 __DEPLOYMENT_MODE__ macro 守门
  #   "href to /billing"       → 某 client 组件加了 SaaS-only 链接但忘了
  #                              wrap CLIENT_CAPABILITIES.billing
  # 详见 .claude/plan/saas-only-inventory.md §17 PR-4 checklist。
  on-prem-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: On-prem build
        env:
          DEPLOYMENT_MODE: on-prem
        run: pnpm build

      - name: Verify on-prem bundle does not bundle SaaS SDKs / secrets
        run: pnpm verify:on-prem-bundle

      - name: Verify on-prem UI does not link to SaaS-only routes
        run: pnpm verify:on-prem-ui

      - name: Audit transitive deps in on-prem build (informational)
        run: pnpm verify:packages
        continue-on-error: true

      - name: Upload on-prem build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: on-prem-build-failed
          path: |
            .open-next/worker.js
            .open-next/server-functions/default/handler.mjs
          if-no-files-found: ignore
          retention-days: 7

  build-migrate-image:
    # 仅在 main 分支 push 时跑（PR 不构建/推镜像）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 必须等 SaaS build + on-prem build 都过，才推 migrate 镜像 ——
    # 防止 on-prem 回归被推到 production
    needs: [build, on-prem-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/wontlost/aster-cloud-migrate:${{ github.sha }}
            docker.io/wontlost/aster-cloud-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger ArgoCD sync to pick up new migrate image
        if: success()
        env:
          ARGOCD_SERVER: argocd.aster-lang.cloud
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          if [ -z "$ARGOCD_AUTH_TOKEN" ]; then
            echo "ARGOCD_AUTH_TOKEN not set; skipping auto-sync"
            exit 0
          fi
          # 重启 aster-cloud Application 让 PreSync hook 重新触发 Job
          curl -fsSL -X POST \
            -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
            "https://$ARGOCD_SERVER/api/v1/applications/aster-cloud/sync" \
            -d '{"revision":"main"}' || echo "::warning::ArgoCD sync trigger failed; migration will run on next sync"
